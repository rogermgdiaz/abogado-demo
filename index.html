<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesoría Legal en Polonia</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Consulta Legal Polonia</h1>
        <p class="text-sm text-gray-600 text-center mb-6">Solicita información sobre tu trámite de legalización.</p>
        
        <form id="legalForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                <input type="text" id="nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Trámite de Interés</label>
                <select id="tramite" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm">
                    <option value="Karta Pobytu">Karta Pobytu</option>
                    <option value="Permiso de Trabajo">Permiso de Trabajo</option>
                    <option value="Asesoría General">Asesoría General</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Teléfono / WhatsApp</label>
                <input type="text" id="telefono" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 text-sm font-semibold">
                Enviar Consulta
            </button>
        </form>
        <div id="status" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <script>
        const BOT_TOKEN = '8701463652:AAGRrrVfD_ZchKnOjDKPfsueygUF5dlo6ss';
        const CHAT_ID = '7138704878';

        document.getElementById('legalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'mt-4 text-center text-sm font-medium text-blue-600';
            statusDiv.textContent = 'Enviando...';
            statusDiv.classList.remove('hidden');

            const nombre = document.getElementById('nombre').value;
            const tramite = document.getElementById('tramite').value;
            const telefono = document.getElementById('telefono').value;

            const text = `📌 *Nueva Consulta Web*\n\n👤 *Nombre:* ${nombre}\n📋 *Trámite:* ${tramite}\n📞 *Contacto:* ${telefono}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    statusDiv.className = 'mt-4 text-center text-sm font-medium text-green-600';
                    statusDiv.textContent = '¡Consulta enviada exitosamente! Te notificaremos al bot.';
                    document.getElementById('legalForm').reset();
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusDiv.className = 'mt-4 text-center text-sm font-medium text-red-600';
                statusDiv.textContent = 'Error al enviar. Intenta nuevamente.';
            }
        });
    </script>
</body>
</html>
